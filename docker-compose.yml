services:
  backend:
    build: .
    env_file: .env
    volumes:
      # cache/estado local persistente (agents.json, caches, sqlite)
      - ./data:/app/data
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped
